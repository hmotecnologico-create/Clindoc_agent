# guiones/baja_laboral.yaml
titulo: "Informe Técnico de Expediente de Baja Laboral"
paciente_campos_identidad:
  - nif
  - nombre_completo
  - fecha_nacimiento
  - num_seguridad_social

secciones:
  - id: S01
    titulo: "Datos de Identificación del Paciente"
    # CONS es el tipo de documento mas frecuente/fiable para estos datos; al fijar
    # fuente_preferente, documento_mas_reciente() elige UN unico documento en vez de
    # caer en la busqueda semantica generica de respaldo (que sin este anclaje traia
    # varios documentos distintos -- todos con la misma cabecera de identificacion --
    # y el redactor, al generar un parrafo por documento, repetia el mismo dato
    # estatico 2-3 veces con redaccion ligeramente distinta cada vez).
    fuente_preferente: CONS
    campos:
      - nombre: nombre_completo
        requerido: true
      - nombre: nif
        requerido: true
        validacion_cruzada: true
      - nombre: fecha_nacimiento
        requerido: false

  - id: S02
    titulo: "Diagnóstico Principal y Datos de la Baja"
    fuente_preferente: ALTA
    campos:
      - nombre: diagnostico_principal
        tipo: texto_clinico
        requerido: true
      - nombre: codigo_cie10
        tipo: string
        requerido: false
        patron: "^[A-Z][0-9]{2}(\\.[0-9]{1,2})?$"
      - nombre: num_seguridad_social
        tipo: string
        requerido: false
      - nombre: empresa
        tipo: string
        requerido: false
      - nombre: fecha_inicio_baja
        tipo: fecha
        requerido: false
        vigencia: activo

  - id: S03
    titulo: "Evolución Clínica"
    campos:
      - nombre: partes_confirmacion
        tipo: lista_cronologica
      - nombre: consulta_especialista
        tipo: texto_clinico
      - nombre: pruebas_complementarias
        tipo: lista

  - id: S04
    titulo: "Conclusión y Estado Actual"
    generado_por: agente_redactor
    instruccion: >
      Redacta un párrafo de conclusión que resuma el estado actual
      del paciente según los documentos analizados.
